<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HR Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         HR INTRO VIDEO
    ========================================== -->

    <section id="introScreen" class="screen intro-screen">

        <video id="introVideo" playsinline preload="auto">
            <source src="Intro HR.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

    </section>


    <!-- =========================================
         HR OFFICE SCENE
    ========================================== -->

    <section id="officeScreen" class="screen office-screen">

        <div class="office-scene">

            <div class="office-background"></div>

            <!-- GIRL -->
            <img src="images/girl hr.png" class="character girl" id="girlCharacter" alt="Girl">

            <!-- BOY -->
            <img src="images/boy hr.png" class="character boy" id="boyCharacter" alt="Boy">

            <!-- FIRST BUBBLE -->
            <div id="firstBubble" class="speech-bubble first-bubble hidden">
                <div id="firstText"></div>
                <div class="bubble-tail"></div>
            </div>

            <!-- YES BUTTON -->
            <button id="yesButton" class="yes-button hidden">
                YES
            </button>

            <!-- SECOND BUBBLE -->
            <div id="secondBubble" class="speech-bubble second-bubble hidden">
                <div id="secondText"></div>
                <div class="bubble-tail"></div>
            </div>

            <!-- GENDER SIGNS -->
            <button id="femaleChoice" class="gender-sign female-sign hidden" aria-label="Choose Female">
                ♀
            </button>

            <button id="maleChoice" class="gender-sign male-sign hidden" aria-label="Choose Male">
                ♂
            </button>

        </div>

        <!-- FINAL LOADING SCREEN -->
        <div id="transitionScreen" class="transition-screen">
            <div class="loading-message">
                Work is underway on the game.
            </div>
        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
