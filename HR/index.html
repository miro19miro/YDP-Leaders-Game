<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YDP HR Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HR INTRO
    ========================== -->

    <section id="introScreen" class="screen intro-screen">

        <video id="introVideo" class="intro-video" autoplay playsinline>
            <source src="Intro HR.mp4" type="video/mp4">
        </video>

    </section>


    <!-- =========================
         CODE SCREEN
    ========================== -->

    <section id="codeScreen" class="screen code-screen hidden">

        <div class="code-card">

            <img src="images/entity-logo.png" class="entity-logo" alt="YDP">

            <h1>HR</h1>

            <p class="code-title">Enter your code</p>

            <input type="text" id="codeInput" class="code-input" placeholder="Enter code" autocomplete="off"
                spellcheck="false">

            <button id="enterCodeBtn" class="enter-btn">
                ENTER
            </button>

            <p id="codeError" class="code-error"></p>

        </div>

    </section>


    <!-- =========================
         TEMPORARY RESULT
    ========================== -->

    <section id="resultScreen" class="screen result-screen hidden">

        <div class="result-card">

            <img src="images/entity-logo.png" class="result-logo" alt="YDP">

            <h2 id="resultTitle"></h2>

            <p id="resultText"></p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
