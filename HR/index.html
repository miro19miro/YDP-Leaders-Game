<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YDP HR Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         INTRO
    ========================================== -->

    <section id="introScreen" class="screen intro-screen">

        <video id="introVideo" class="intro-video" autoplay playsinline>
            <source src="Intro HR.mp4" type="video/mp4">
        </video>

    </section>


    <!-- =========================================
         CODE SCREEN
    ========================================== -->

    <section id="codeScreen" class="screen code-screen hidden">

        <div class="code-card">

            <img src="images/entity-logo.png" class="entity-logo" alt="YDP">

            <h1>HR</h1>

            <p class="code-title">
                Enter your code
            </p>

            <input type="text" id="codeInput" class="code-input" placeholder="Enter code" autocomplete="off"
                spellcheck="false">

            <button id="enterCodeBtn" class="main-btn" type="button">
                ENTER
            </button>

            <p id="codeError" class="error-message"></p>

        </div>

    </section>


    <!-- =========================================
         PLAYER - CHOOSE GENDER
    ========================================== -->

    <section id="genderScreen" class="screen gender-screen hidden">

        <div class="gender-background"></div>


        <h1 class="gender-title">
            Choose your gender
        </h1>


        <div class="gender-characters">

            <!-- GIRL -->

            <button id="girlChoice" class="character-choice girl-choice" type="button">

                <img src="images/girl hr.png" alt="Girl">

            </button>


            <!-- BOY -->

            <button id="boyChoice" class="character-choice boy-choice" type="button">

                <img src="images/boy hr.png" alt="Boy">

            </button>

        </div>

    </section>


    <!-- =========================================
         PLAYER - CHOOSE NAME
    ========================================== -->

    <section id="nameScreen" class="screen name-screen hidden">

        <div class="name-background"></div>


        <div class="name-content">

            <h1>
                Choose your name
            </h1>

            <p>
                Select your name to continue
            </p>


            <div id="membersList" class="members-list">
                <!-- Members will be added by JavaScript -->
            </div>


            <button id="nameContinueBtn" class="main-btn name-continue-btn" type="button" disabled>
                CONTINUE
            </button>


            <p id="nameError" class="error-message"></p>

        </div>

    </section>


    <!-- =========================================
         TEMPORARY PLAYER SCREEN
         هنستبدلها بالـHR Office بعدين
    ========================================== -->

    <section id="playerReadyScreen" class="screen ready-screen hidden">

        <div class="ready-card">
            <img src="images/entity-logo.png" class="ready-logo" alt="YDP">

            <h1>
                Welcome!
            </h1>

            <p id="welcomeText"></p>

            <p class="small-text">
                HR Office will be connected next.
            </p>

        </div>

    </section>


    <!-- =========================================
         TEMPORARY ADMIN SCREEN
         هنستبدله بالـControl Panel بعدين
    ========================================== -->

    <section id="adminScreen" class="screen ready-screen hidden">

        <div class="ready-card">

            <img src="images/entity-logo.png" class="ready-logo" alt="YDP">

            <h1>
                Admin Access
            </h1>

            <p>
                Control Panel will be connected next.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
